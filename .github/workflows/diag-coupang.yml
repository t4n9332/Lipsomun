# 임시 진단: 운영 사이트의 쿠팡 구매 링크가 제휴 추적 링크로 끝나는지 따라가 본다. 확인 후 삭제.
name: 진단 - 쿠팡 링크 추적
on:
  push:
    branches: ["claude/clever-pascal-f353qk"]
    paths: [".github/workflows/diag-coupang.yml"]
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - name: 상품 페이지에서 /go 링크 찾아 리다이렉트 추적
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          echo "== 홈 =="
          curl -sS -A "$UA" https://lipsomun.co.kr/ -o home.html -w "%{http_code} %{size_download}\n"
          grep -o 'href="/p/[^"]*"' home.html | head -5 | tee p.txt
          for p in $(grep -o '/p/[^"]*' p.txt | head -3); do
            echo; echo "== 상품 $p =="
            curl -sS -A "$UA" "https://lipsomun.co.kr$p" -o prod.html -w "%{http_code}\n"
            grep -o 'href="/go/[^"]*"[^>]*' prod.html | head -3
            for g in $(grep -o '/go/[^"]*' prod.html | head -2); do
              echo "-- $g"
              curl -sS -A "$UA" -H "Sec-Fetch-Site: same-origin" -o /dev/null -w "lipsomun → %{http_code} %{redirect_url}\n" "https://lipsomun.co.kr$g"
              loc=$(curl -sS -A "$UA" -o /dev/null -w "%{redirect_url}" "https://lipsomun.co.kr$g")
              # 쿠팡 쪽 리다이렉트 체인 (최대 6단계)
              for i in 1 2 3 4 5 6; do
                [ -z "$loc" ] && break
                case "$loc" in *coupang*|*link.*) ;; *) echo "   (쿠팡 아님) $loc"; break;; esac
                nxt=$(curl -sS -A "$UA" -o /dev/null -w "%{http_code} %{redirect_url}" "$loc" || true)
                echo "   $i: $(echo "$loc" | cut -c1-220)"
                echo "      → $nxt" | cut -c1-260
                loc=$(echo "$nxt" | cut -d' ' -f2-)
              done
            done
          done
          echo; echo "== 홈의 /go 링크 형태 집계 =="
          grep -o 'href="https\?://[^"]*coupang[^"]*"' home.html | head -5
