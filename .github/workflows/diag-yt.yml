# 임시: 참고 영상의 배경음악 출처(곡명·저작권 표기)를 공개 메타데이터에서 확인 (영상·음원은 받지 않음). 확인 후 삭제.
name: 진단 - 참고 영상 음악 출처
on:
  push:
    branches: ["claude/clever-pascal-f353qk"]
    paths: [".github/workflows/diag-yt.yml"]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q yt-dlp
      - run: |
          for V in ohaNolDv6zE; do
            yt-dlp --skip-download --no-warnings --dump-single-json "https://www.youtube.com/watch?v=$V" > m.json || true
            python3 - <<'PY'
          import json
          try:
              d = json.load(open("m.json"))
          except Exception as e:
              print("메타데이터 실패", e); raise SystemExit
          for k in ["title", "uploader", "channel", "upload_date", "duration", "track", "artist", "album", "creator", "license", "tags"]:
              print(k, "=", d.get(k))
          print("== 설명란 ==")
          print(d.get("description"))
          PY
          done
      - name: 같은 채널의 다른 영상 제목 (원곡 정보 단서)
        run: |
          yt-dlp --flat-playlist --no-warnings --print "%(title)s | %(id)s" "https://www.youtube.com/@machine8932/videos" 2>/dev/null | head -20 || true
