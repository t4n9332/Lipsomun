# 편의점 행사 월간 갱신 — 매월 1일 09:10 KST 에 4사 행사상품을 모아 data/cvs 에 커밋한다.
# 커밋되면 Vercel 이 다시 빌드해 /cvs(행사 모음·버프/너프 패치노트·어디가 이득)가 바뀐다.
#
# 편의점 행사는 1일 0시에 바뀌지만 사이트 반영이 늦는 곳이 있어 아침에 돈다.
# 한 곳이라도 실패하면 그 편의점은 지난 데이터를 유지한 채 커밋하고, 잡은 실패로 끝나
# 저장소 주인에게 GitHub 실패 메일이 간다. 'Run workflow' 버튼으로 언제든 다시 돌릴 수 있다.

name: 편의점 행사 월간 갱신

on:
  schedule:
    - cron: "10 0 1 * *" # 매월 1일 00:10 UTC = 09:10 KST
  workflow_dispatch:
    inputs:
      dry:
        description: "저장 없이 수집 결과만 확인 (파서 점검용)"
        type: boolean
        default: false
      only:
        description: "한 편의점만 (gs25 / cu / seven / emart24, 비우면 전체)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: cvs-monthly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 행사상품 수집
        id: collect
        continue-on-error: true
        working-directory: ipsomun
        env:
          # 세븐일레븐은 해외 IP 를 막아 사이트의 서울 리전 중계로 받는다 (app/api/cvs/proxy)
          CVS_PROXY_URL: https://lipsomun.co.kr/api/cvs/proxy
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/cvs-collect.mjs ${{ inputs.dry && '--dry' || '' }} ${{ inputs.only && format('--only={0}', inputs.only) || '' }}

      - name: 파서 점검용 원문 보관 (수집 실패 시)
        if: steps.collect.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cvs-debug
          path: ipsomun/scripts/cvs-debug/
          if-no-files-found: ignore

      - name: 커밋·푸시
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipsomun/data/cvs
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          n=$(node -e "console.log(require('./ipsomun/data/cvs/current.json').items.length)")
          m=$(node -e "console.log(require('./ipsomun/data/cvs/current.json').month)")
          git commit -m "편의점 행사 갱신 — ${m} ${n}개 (cvs-monthly)"
          git push

      # 새 데이터가 배포된 뒤 텔레그램 채널에 이번 달 브리핑을 보낸다.
      # 배포 전이면 서버가 409 를 돌려주므로 1분 간격으로 최대 10번 다시 부른다. 달마다 한 번만 나간다.
      - name: 텔레그램 월간 브리핑
        if: ${{ !inputs.dry }}
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -m 40 -o r.json -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" https://lipsomun.co.kr/api/cron/cvs-notify || echo 000)
            echo "[$i] $code $(cat r.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            [ "$code" != "409" ] && [ "$code" != "000" ] && exit 1
            sleep 60
          done
          echo "::warning::배포가 늦어 브리핑을 보내지 못했습니다. 나중에 /api/cron/cvs-notify 를 수동 호출하세요."

      - name: 수집 실패 알림
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::일부 편의점 수집 실패 — 해당 편의점은 지난 데이터 유지. Artifacts 의 cvs-debug 로 파서를 점검하세요."
          exit 1
