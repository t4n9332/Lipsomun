# 임시 진단: GS25 공식 웹의 행사상품 데이터 경로 찾기 (실제 브라우저로 열어 네트워크 기록). 확인 후 삭제.
name: 진단 - GS25 행사 데이터 경로
on:
  push:
    branches: ["claude/clever-pascal-f353qk"]
    paths: [".github/workflows/diag-gs25.yml", ".github/diag/gs25-probe.mjs"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p /tmp/p && cd /tmp/p && npm init -y >/dev/null && npm i -s playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cp $GITHUB_WORKSPACE/.github/diag/gs25-probe.mjs . && node gs25-probe.mjs
