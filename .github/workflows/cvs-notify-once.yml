# 임시: 11월 편의점 브리핑 1회 발송 (운영자 요청 2026-11-04). 발송 확인 후 삭제.
name: 편의점 브리핑 1회 발송
on:
  push:
    branches: ["claude/clever-pascal-f353qk"]
    paths: [".github/workflows/cvs-notify-once.yml"]
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -m 40 -o r.json -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" https://lipsomun.co.kr/api/cron/cvs-notify || echo 000)
            echo "[$i] $code $(cat r.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            [ "$code" != "409" ] && [ "$code" != "404" ] && exit 1
            sleep 60
          done
          exit 1
